<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="../style/common.css">
  <link rel="stylesheet" href="../style/order.css">
  <title>クリーニング依頼</title>
</head>

<body data-page="order-detail">
  <header class="page-header">
    <h1>注文作成</h1>
    <nav class="nav">
      <a class="btn btn-ghost" href="./index.html">← 一覧へ</a>
    </nav>
  </header>

  <main class="container">
    <section class="card">
      <h2>入力</h2>

      <div class="grid-2">
        <label class="field">
          <span>hotel_id *</span>
          <input id="hotel_id" type="number" min="1" required />
        </label>

        <label class="field">
          <span>room_no *</span>
          <input id="room_no" type="text" maxlength="20" required placeholder="例: 1203" />
        </label>

        <label class="field">
          <span>status</span>
          <select id="status">
            <option value="draft">draft</option>
            <option value="placed" selected>placed</option>
            <option value="cancelled">cancelled</option>
            <option value="completed">completed</option>
          </select>
        </label>

        <label class="field">
          <span>requested_at（希望日時）</span>
          <input id="requested_at" type="datetime-local" />
        </label>

        <label class="field">
          <span>payment *</span>
          <select id="payment">
            <option value="1" selected>1: Olyc</option>
            <option value="2">2: ホテル</option>
            <option value="3">3: その他</option>
          </select>
        </label>

        <label class="field">
          <span>total_amount *</span>
          <input id="total_amount" type="number" step="0.01" min="0" required placeholder="例: 8800.00" />
        </label>
      </div>

      <label class="field">
        <span>notes</span>
        <textarea id="notes" rows="4" maxlength="2000" placeholder="伝達事項"></textarea>
      </label>

      <div class="row">
        <button id="create-btn" class="btn">作成</button>
        <span id="status-text" class="status"></span>
      </div>

      <p class="hint">
        ※ order_no はサーバ側で採番されます（例: 20251221-000123）
      </p>
    </section>
  </main>

  <script src="../js/common.js"></script>
  <script src="../js/order.js"></script>
</body>
</html>
