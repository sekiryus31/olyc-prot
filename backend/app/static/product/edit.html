<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../style/common.css">
  <link rel="stylesheet" href="../style/product.css">
  <title>商品情報編集</title>

</head>

<body data-page="product-edit">
  <header>
    <div>
      <h1>商品 編集</h1>
      <div class="muted">内容を変更して保存</div>
    </div>

    <div class="toolbar">
      <button id="backBtn">詳細へ戻る</button>
      <button id="saveBtn">保存</button>
    </div>
  </header>

  <div id="status"></div>

  <form id="form" class="form">
    <table class="kv">
      <tbody>
        <tr><th>ID</th><td id="v_id">-</td></tr>

        <tr>
          <th>コード</th>
          <td><input id="code" type="text" maxlength="50" placeholder="例：SKU-001" /></td>
        </tr>

        <tr>
          <th>商品名<span class="req">*</span></th>
          <td><input id="name" type="text" maxlength="255" required /></td>
        </tr>

        <tr>
          <th>カテゴリ</th>
          <td>
            <select id="category_id">
              <option value="">未指定</option>
            </select>
          </td>
        </tr>

        <tr>
          <th>価格<span class="req">*</span></th>
          <td><input id="price" type="number" min="0" step="0.01" required /></td>
        </tr>

        <tr>
          <th>ホテル</th>
          <td>
            <select id="hotel_id">
              <option value="">共通（未指定）</option>
            </select>
          </td>
        </tr>

        <tr>
          <th>説明</th>
          <td><textarea id="description" rows="4" maxlength="1000"></textarea></td>
        </tr>
      </tbody>
    </table>
  </form>

  <script src="../js/common.js"></script>
  <script src="../js/products.js"></script>

</body>
</html>
