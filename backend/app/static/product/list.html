<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../style/common.css">
  <link rel="stylesheet" href="../style/product.css">
  <title>商品一覧</title>

</head>
<body>
  <h1>商品一覧</h1>
  <p>API から取得したデータをテーブルに表示しています。</p>
  <button id="updateBtn">更新</button>
  <a href="create.html"><button>新規登録</button></a>

  <table id="product-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>商品名</th>
        <th>コード</th>
        <th>単価</th>
        <th>カテゴリー</th>
      </tr>
    </thead>
    <tbody>
      <!-- JS でここに行を追加する -->
    </tbody>
  </table>


  <script src="../js/common.js"></script>
  <script src="../js/products.js"></script>
  <script>
    // ページ表示時に一覧読み込み
    loadProducts();
    
    // 更新ボタン押下
    document.getElementById("updateBtn").addEventListener("click", loadProducts);
 
  </script>
</body>
</html>
