<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../style/common.css">
  <link rel="stylesheet" href="../style/product.css">
  <title>商品情報詳細</title>

</head>

<body data-page="product-detail">
  <header>
    <div>
      <h1>商品 詳細</h1>
      <div class="muted">登録内容の確認</div>
    </div>
    <div class="toolbar">
      <button id="backBtn">一覧へ戻る</button>
      <button id="editBtn">編集</button>
      <button id="deleteBtn" class="danger">削除</button>
    </div>
  </header>

  <div id="status"></div>

  <table class="kv">
    <tbody>
      <tr><th>ID</th><td id="v_id">-</td></tr>
      <tr><th>コード</th><td id="v_code">-</td></tr>
      <tr><th>商品名</th><td id="v_name">-</td></tr>
      <tr><th>カテゴリ</th><td id="v_category">-</td></tr>
      <tr><th>価格</th><td id="v_price">-</td></tr>
      <tr><th>ホテル</th><td id="v_hotel">-</td></tr>
      <tr><th>説明</th><td id="v_description">-</td></tr>
      <tr><th>作成日</th><td id="v_created_at">-</td></tr>
      <tr><th>更新日</th><td id="v_updated_at">-</td></tr>
    </tbody>
  </table>


  <script src="../js/common.js"></script>
  <script src="../js/products.js"></script>
</body>
</html>
