<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../style/common.css">
  <link rel="stylesheet" href="../style/category.css">
  <title>カテゴリ一覧</title>

</head>
<body data-page="category-list">
  <header>
    <div>
      <h1>カテゴリ一覧</h1>
      <div class="muted">クリックで詳細へ</div>
    </div>
    <div class="toolbar">
      <input id="q" type="search" placeholder="コード/カテゴリ名で検索" />
      <button id="reloadBtn">再読み込み</button>
      <button id="newBtn">新規登録</button>
    </div>
  </header>


  <div id="status" class=""></div>
  <table id="tbl" style="display:none;">
    <thead>
      <tr>
        <th>ID</th>
        <th>表示順</th>
        <th>ホテル名</th>
        <th>カテゴリ名</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>


  <script src="../js/common.js"></script>
  <script src="../js/categories.js"></script>

</body>
</html>
