<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../style/common.css">
  <link rel="stylesheet" href="../style/category.css">
  <title>ホテル登録</title>
</head>
<body data-page="category-new">
<header>
  <div>
    <h1>カテゴリ新規登録</h1>
    <div class="muted">入力して登録してください</div>
  </div>

  <div class="toolbar">
    <button id="backBtn">一覧へ戻る</button>
    <button id="saveBtn">保存</button>
  </div>
</header>
   <div class="wrap">
      <div id="status" class=""></div>

      <form id="frm">
        <div class="form-grid">
          <label>
            <div class="label">コード（必須・ユニーク）</div>
            <input id="code" type="text" placeholder="例：FOOD" required />
          </label>

          <label>
            <div class="label">カテゴリ名（必須）</div>
            <input id="name" type="text" placeholder="例：食品" required />
          </label>

          <label>
            <div class="label">表示順（任意）</div>
            <input id="sortOrder" type="number" placeholder="例：10" />
          </label>
        </div>
      </form>
    </div>

  <script src="../js/common.js"></script>
  <script src="../js/categories.js"></script>
  <script>
    // ホテル新規追加
    // document.getElementById("saveBtn").addEventListener("click", createHotel);

    // 一覧画面へ戻る
    // document.getElementById("backBtn").addEventListener("click", pageBackBtn);
  </script>
</body>
</html>
