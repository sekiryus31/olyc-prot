<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>カテゴリ編集</title>
  <link rel="stylesheet" href="../style/common.css">
  <link rel="stylesheet" href="../style/category.css">
</head>
<body>
  <div class="toolbar">
    <a href="./index.html">← 一覧へ</a>
    <div id="status" class="status"></div>
  </div>

  <h1>カテゴリ編集</h1>

  <div class="card">
    <div class="row">
      <div>
        <label>ID</label>
        <input id="id" disabled />
      </div>
      <div>
        <label>code（必須・ユニーク）</label>
        <input id="code" />
      </div>
      <div>
        <label>name（必須）</label>
        <input id="name" />
      </div>
      <div>
        <label>sort_order</label>
        <input id="sort_order" type="number" />
      </div>
    </div>

    <div style="margin-top:12px; display:flex; gap:10px; flex-wrap:wrap;">
      <button id="save-btn">保存</button>
      <button id="delete-btn" class="danger">削除（非表示）</button>
    </div>
  </div>

  <script src="../js/common.js"></script>
  <script src="../js/categories.js"></script>
</body>
</html>
