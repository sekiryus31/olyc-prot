<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>カテゴリ詳細</title>
  <link rel="stylesheet" href="../style/common.css">
  <link rel="stylesheet" href="../style/category.css">
</head>
<body data-page="category-detail">
  <h1>カテゴリ詳細</h1>

  <div id="status" class="muted">読み込み中...</div>

  <table class="kv">
    <tbody>
      <tr><th>ID</th><td id="id">-</td></tr>
      <tr><th>コード</th><td id="code">-</td></tr>
      <tr><th>名前</th><td id="name">-</td></tr>
      <tr><th>並び順</th><td id="sort_order">-</td></tr>
      <tr><th>削除フラグ</th><td id="delete_flag">-</td></tr>
    </tbody>
  </table>

  <div class="actions">
    <button id="reloadBtn" type="button">再読み込み</button>
    <button id="editBtn" type="button">編集</button>
    <button id="deleteBtn" type="button" class="danger">削除</button>
    <a href="list.html">一覧へ戻る</a>
  </div>


  <script src="../js/common.js"></script>
  <script src="../js/categories.js"></script>
</body>
</html>
