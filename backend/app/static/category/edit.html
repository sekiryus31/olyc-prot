<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ホテル編集</title>
  <link rel="stylesheet" href="../style/common.css">
  <link rel="stylesheet" href="../style/category.css">
</head>
<body data-page="category-edit">
  <div class="container">
    <p><a id="backLink" href="detail.html">← 詳細へ戻る</a></p>

    <h1>ホテル編集</h1>

    <div id="status"></div>

      <form id="form">
        <label>カテゴリ名</label>
        <input id="name" type="text" required placeholder="例：ワイシャツ" />

        <!-- sort_order があるなら使う -->
        <label>表示順（任意）</label>
        <input id="sort_order" type="number" placeholder="例：10" />

        <div class="row">
          <button id="saveBtn" type="submit">保存</button>
          <button id="backBtn" type="button">戻る</button>
        </div>
      </form>
  </div>

  <script src="../js/common.js"></script>
  <script src="../js/categories.js"></script>
</body>
</html>
