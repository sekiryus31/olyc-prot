<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ホテル編集</title>
  <link rel="stylesheet" href="../style/common.css">
  <link rel="stylesheet" href="../style/category.css">
</head>
<body>
  <div class="container">
    <p><a id="backLink" href="detail.html">← 詳細へ戻る</a></p>

    <h1>ホテル編集</h1>

    <div id="status"></div>

    <form id="form">
      <div class="field">
        <label>ID</label>
        <input id="id" type="text" disabled />
      </div>

      <div class="field">
        <label>コード</label>
        <input id="code" type="text" maxlength="50" />
      </div>

      <div class="field">
        <label>名前<span class="req">*</span></label>
        <input id="name" type="text" maxlength="255" required />
      </div>

      <div class="field">
        <label>住所</label>
        <input id="address" type="text" maxlength="255" />
      </div>

      <div class="field">
        <label>電話</label>
        <input id="phone" type="text" maxlength="50" />
      </div>

      <div class="actions">
        <button id="saveBtn" type="submit">保存</button>
        <button id="reloadBtn" type="button">リセット</button>
      </div>
    </form>
  </div>

  <script src="../js/common.js"></script>
  <script src="../js/categories.js"></script>
  <script>
    // ページ表示時に情報読み込み
    // loadHotelEdit();
    // 更新ボタン押下
    // document.getElementById("update-Btn").addEventListener("click", updateHotel);
 
 </script>
</body>
</html>
