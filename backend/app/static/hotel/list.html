<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../style/common.css">
  <link rel="stylesheet" href="../style/hotels.css">
  <title>ホテル一覧</title>

</head>
<body>
  <header>
    <div>
      <h1>ホテル一覧</h1>
      <div class="muted">クリックで詳細へ</div>
    </div>
    <div class="toolbar">
      <input id="q" type="search" placeholder="コード/ホテル名で検索" />
      <button id="reloadBtn">再読み込み</button>
      <button id="newBtn">新規登録</button>
    </div>
  </header>


  <div id="status" class=""></div>
  <table id="tbl" style="display:none;">
    <thead>
      <tr>
        <th>ID</th>
        <th>コード</th>
        <th>ホテル名</th>
        <th>住所</th>
        <th>電話</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>


  <script src="../js/common.js"></script>
  <script src="../js/hotels.js"></script>
  <script>
    // ページ表示時に一覧読み込み
    window.loadHotels = async function () {
      console.log("loadHotels start");
    };

    document.getElementById("reloadBtn").addEventListener("click", () => loadHotels());
    document.getElementById("newBtn").addEventListener("click", () => {
        location.href = "create.html";
    });
  </script>
</body>
</html>
