<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ホテル詳細</title>
  <link rel="stylesheet" href="../style/common.css">
  <link rel="stylesheet" href="../style/hotels.css">
</head>
<body>
  <div class="container">
    

    <h1>ホテル詳細</h1>

    <div id="status"></div>

    <table class="kv">
      <tbody>
        <tr><th>ID</th><td id="v_id">-</td></tr>
        <tr><th>コード</th><td id="v_code">-</td></tr>
        <tr><th>名前</th><td id="v_name">-</td></tr>
        <tr><th>住所</th><td id="v_address">-</td></tr>
        <tr><th>電話</th><td id="v_phone">-</td></tr>
      </tbody>
    </table>

    <div class="actions">
      <button id="reloadBtn" type="button">再読み込み</button>
      <button id="editBtn" type="button">編集</button>
      <button id="deleteBtn" type="button">削除</button>
    </div>

    <p><a href="./list.html">← 一覧へ戻る</a></p>
  </div>

  <script src="../js/common.js"></script>
  <script src="../js/hotels.js"></script>

</body>
</html>
